<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-label="Rooftop solar panels power the home first, and surplus electricity flows through the meter to the grid as bill credits">
  <rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fafc"/>
  <style>
    .lbl{font:600 15px system-ui,sans-serif;fill:#0f172a}
    .sub{font:13px system-ui,sans-serif;fill:#475569}
    .cap{font:700 13px system-ui,sans-serif;fill:#b45309}
  </style>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#0369a1"/>
    </marker>
  </defs>

  <!-- Sun -->
  <circle cx="90" cy="80" r="30" fill="#fde68a" stroke="#f59e0b"/>
  <g stroke="#f59e0b" stroke-width="2.5">
    <line x1="90" y1="30" x2="90" y2="14"/><line x1="140" y1="80" x2="156" y2="80"/>
    <line x1="126" y1="44" x2="138" y2="32"/><line x1="126" y1="116" x2="138" y2="128"/>
  </g>

  <!-- House with panels -->
  <rect x="210" y="150" width="180" height="120" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <path d="M300 96 L410 150 L190 150 Z" fill="#bbf7d0" stroke="#4ade80"/>
  <g fill="#1e3a8a" stroke="#1e40af">
    <rect x="236" y="118" width="46" height="24" rx="2" transform="skewX(-20)"/>
    <rect x="300" y="118" width="46" height="24" rx="2" transform="skewX(-20)"/>
  </g>
  <text x="300" y="220" text-anchor="middle" class="lbl">Your home</text>
  <text x="300" y="242" text-anchor="middle" class="sub">uses solar first</text>

  <!-- Meter -->
  <rect x="440" y="180" width="70" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="475" y="215" text-anchor="middle" class="sub">Meter</text>

  <!-- Grid -->
  <rect x="548" y="150" width="60" height="120" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <path d="M578 150 L566 120 M578 150 L590 120 M560 200 H596 M560 230 H596" stroke="#64748b" stroke-width="2" fill="none"/>
  <text x="578" y="290" text-anchor="middle" class="sub">Grid</text>

  <!-- Flows -->
  <path d="M110 96 Q180 110 246 138" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M394 210 H436" fill="none" stroke="#0369a1" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M512 210 H544" fill="none" stroke="#0369a1" stroke-width="2.5" marker-end="url(#a2)"/>

  <text x="320" y="325" text-anchor="middle" class="cap">Surplus flows to the grid — often earning a net-metering credit on your bill.</text>
</svg>
