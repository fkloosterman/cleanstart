<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-label="A heat pump moving heat between outdoor air and indoor air, reversing between heating and cooling modes">
  <rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fafc"/>
  <style>
    .lbl{font:600 15px system-ui,sans-serif;fill:#0f172a}
    .sub{font:13px system-ui,sans-serif;fill:#475569}
    .cap{font:700 13px system-ui,sans-serif;fill:#0369a1}
  </style>

  <!-- Outdoor side -->
  <rect x="36" y="90" width="200" height="180" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="136" y="118" text-anchor="middle" class="lbl">Outdoor air</text>
  <text x="136" y="140" text-anchor="middle" class="sub">even cold air holds heat</text>
  <rect x="86" y="160" width="100" height="80" rx="8" fill="#fff" stroke="#38bdf8"/>
  <text x="136" y="205" text-anchor="middle" class="sub">Outdoor coil</text>

  <!-- Indoor side (house) -->
  <rect x="404" y="90" width="200" height="180" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <path d="M504 96 L560 132 L448 132 Z" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="504" y="118" text-anchor="middle" class="lbl">Indoor</text>
  <rect x="454" y="160" width="100" height="80" rx="8" fill="#fff" stroke="#4ade80"/>
  <text x="504" y="205" text-anchor="middle" class="sub">Indoor coil</text>

  <!-- Compressor in the middle -->
  <circle cx="320" cy="200" r="34" fill="#fff" stroke="#94a3b8"/>
  <text x="320" y="196" text-anchor="middle" class="sub">Comp-</text>
  <text x="320" y="212" text-anchor="middle" class="sub">ressor</text>

  <!-- Refrigerant loop arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#0369a1"/>
    </marker>
  </defs>
  <path d="M186 190 H286" fill="none" stroke="#0369a1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M354 210 H454" fill="none" stroke="#0369a1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="320" y="70" text-anchor="middle" class="cap">Winter: heat is moved from outside → in</text>
  <text x="320" y="300" text-anchor="middle" class="cap">Summer: the cycle reverses, moving heat out</text>
  <text x="320" y="330" text-anchor="middle" class="sub">A heat pump moves heat rather than burning fuel to make it.</text>
</svg>
