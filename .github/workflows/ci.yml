name: CI

on:
  pull_request:
    # phase-3 is the Phase 3 integration branch; WP3.x PRs target it, so CI
    # must gate them too (removed when phase-3 promotes to dev and is deleted).
    branches: [dev, mvp, phase-3]
  push:
    branches: [dev, mvp, phase-3]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Validate content
        run: bun run validate:content
